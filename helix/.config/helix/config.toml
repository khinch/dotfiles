# theme = "catppuccin_mocha"
# theme = "root-loops"
theme = "gruvbox_dark_soft"

[editor]
line-number = "relative"
bufferline = "always"
popup-border = "all"

[editor.cursor-shape]
insert = "bar"

[editor.file-picker]
hidden = false

[editor.soft-wrap]
enable = true

[keys.normal]
"A-j" = ["extend_to_line_bounds", "delete_selection", "paste_after"]
"A-k" = ["extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before"]
"A-o" = ["yank_to_clipboard", ":sh aichat \"explain this code\""]
"C-j" = ["page_down"]
"C-k" = ["page_up"]
