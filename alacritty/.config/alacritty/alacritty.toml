general.import = [
  "~/.config/alacritty/themes/catppuccin-mocha.yaml"
  #"~/.config/alacritty/themes/root-loops.yaml"
]

[env]
TERM = "xterm-256color"

[font]
size = 12.0

[font.bold]
# family = "CaskaydiaCove Nerd Font"
family = "Hack Nerd Font Mono"
style = "Bold"

[font.bold_italic]
family = "Hack Nerd Font Mono"
style = "Bold Italic"

[font.italic]
family = "Hack Nerd Font Mono"
style = "Italic"

[font.normal]
family = "Hack Nerd Font Mono"
style = "Regular"

[window]
opacity = 0.9

[terminal]
osc52 = "CopyPaste"
